<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Simple Workout v2 — ascending ladder rungs on Google Blue,
       echoing the Home screen's translucent circles; the tallest bar
       is streak-yellow. -->
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#1A73E8"/>
    <circle cx="50" cy="14" r="26" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="58" cy="30" r="13" fill="#FFFFFF" opacity="0.14"/>
    <rect x="12" y="36" width="9" height="16" rx="4.5" fill="#FFFFFF" opacity="0.75"/>
    <rect x="27" y="27" width="9" height="25" rx="4.5" fill="#FFFFFF"/>
    <rect x="42" y="15" width="9" height="37" rx="4.5" fill="#FCC934"/>
  </g>
</svg>
